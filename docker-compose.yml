services:
  catalog-1:
    image: ais-catalog:latest
    build:
      context: .
      dockerfile: catalog_service/Dockerfile
    environment:
      INSTANCE_NAME: catalog-1
      PORT: 8000

  catalog-2:
    image: ais-catalog:latest
    environment:
      INSTANCE_NAME: catalog-2
      PORT: 8000
    depends_on:
      - catalog-1

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - catalog-1
      - catalog-2