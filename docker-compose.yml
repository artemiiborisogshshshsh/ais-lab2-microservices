
services:
  consul:
    image: hashicorp/consul:latest
    command: agent -dev -client=0.0.0.0
    ports:
      - "8500:8500"

  auth-service:
    build:
      context: .
      dockerfile: auth_service/Dockerfile
    environment:
      CONSUL_URL: http://consul:8500
      SERVICE_NAME: auth
      SERVICE_ID: auth-service
      SERVICE_HOST: auth-service
      PORT: 8000
    depends_on:
      - consul

  catalog-1:
    image: ais-catalog:latest
    build:
      context: .
      dockerfile: catalog_service/Dockerfile
    environment:
      INSTANCE_NAME: catalog-1
      CONSUL_URL: http://consul:8500
      SERVICE_NAME: catalog
      SERVICE_ID: catalog-1
      SERVICE_HOST: catalog-1
      PORT: 8000
    depends_on:
      - consul
    ports:
      - "127.0.0.1:8001:8000"

  catalog-2:
    image: ais-catalog:latest
    environment:
      INSTANCE_NAME: catalog-2
      CONSUL_URL: http://consul:8500
      SERVICE_NAME: catalog
      SERVICE_ID: catalog-2
      SERVICE_HOST: catalog-2
      PORT: 8000
    depends_on:
      - consul
      - catalog-1
    ports:
      - "127.0.0.1:8002:8000"

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - catalog-1
      - catalog-2
      - auth-service

  order-service:
    build:
      context: .
      dockerfile: order_service/Dockerfile
    ports:
      - "127.0.0.1:8003:8000"
    environment:
      RABBITMQ_URL: amqp://lab4:lab4pass@rabbitmq:5672/%2F
    depends_on:
      - rabbitmq

  graphql-gateway:
    build:
      context: .
      dockerfile: graphql_gateway/Dockerfile
    ports:
      - "127.0.0.1:8004:8000"
    environment:
      ORDER_SERVICE_URL: http://order-service:8000
      CATALOG_SERVICE_URL: http://nginx/catalog
    depends_on:
      - order-service
      - nginx

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: lab4
      RABBITMQ_DEFAULT_PASS: lab4pass
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  payment-service:
    build:
      context: .
      dockerfile: payment_service/Dockerfile
    environment:
      RABBITMQ_URL: amqp://lab4:lab4pass@rabbitmq:5672/%2F
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  notification-service:
    build:
      context: .
      dockerfile: notification_service/Dockerfile
    environment:
      RABBITMQ_URL: amqp://lab4:lab4pass@rabbitmq:5672/%2F
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  payment-grpc:
    build:
      context: .
      dockerfile: payment_service/Dockerfile.grpc
    ports:
      - "127.0.0.1:50051:50051"
    environment:
      GRPC_PORT: "50051"
    restart: unless-stopped

  # ЛР6: Apache Kafka
  kafka:
    image: apache/kafka:4.1.2
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://localhost:9091,HOST://0.0.0.0:9092,DOCKER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,HOST:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9091
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data

  # ЛР6: Kafka UI
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    ports:
      - "127.0.0.1:8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: lab6-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9093
    depends_on:
      - kafka

  # ЛР6: CQRS Read Side
  
  order-read-service:
    build:
      context: .
      dockerfile: order_read_service/Dockerfile
    ports:
      - "127.0.0.1:8005:8000"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9093
    depends_on:
      - kafka
    restart: unless-stopped


volumes:
  kafka-data:
  
