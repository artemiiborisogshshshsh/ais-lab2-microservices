events {
}

http {
    upstream catalog_backend {
        server catalog-1:8000 max_fails=1 fail_timeout=5s;
        server catalog-2:8000 max_fails=1 fail_timeout=5s;
    }

    upstream auth_backend {
        server auth-service:8000;
    }

    server {
        listen 80;

        # Внутренняя проверка JWT
        location = /_jwt_validate {
            internal;

            proxy_pass http://jwt-validator:8000/internal/validate;
            proxy_method GET;

            proxy_pass_request_body off;
            proxy_set_header Content-Length "";

            proxy_set_header Authorization $http_authorization;
        }

        # Защищённый Catalog Service
        location /catalog/ {
            auth_request /_jwt_validate;

            auth_request_set $verified_user_id $upstream_http_x_user_id;
            auth_request_set $verified_user_role $upstream_http_x_user_role;

            proxy_set_header X-User-Id $verified_user_id;
            proxy_set_header X-User-Role $verified_user_role;
            proxy_set_header Authorization "";

            proxy_pass http://catalog_backend/;

            proxy_connect_timeout 1s;
            proxy_send_timeout 5s;
            proxy_read_timeout 5s;

            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 2s;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Публичные маршруты Auth Service
        location /auth/ {
            proxy_pass http://auth_backend/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}