global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: auth
    static_configs:
      - targets:
          - auth-service:8000

  - job_name: catalog
    static_configs:
      - targets:
          - catalog-1:8000
          - catalog-2:8000

  - job_name: order
    static_configs:
      - targets:
          - order-service:8000

  - job_name: api-gateway
    static_configs:
      - targets:
          - api-gateway:8000